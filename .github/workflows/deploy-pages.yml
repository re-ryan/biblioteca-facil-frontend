name: Publica no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o código
        uses: actions/checkout@v6

      - name: Configura o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instala as dependências
        run: npm ci

      - name: Gera os arquivos de produção
        run: npm run build
        env:
          VITE_BASE_PATH: /biblioteca-facil-frontend/

      - name: Adiciona o fallback das rotas
        run: cp dist/index.html dist/404.html

      - name: Configura o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara os arquivos para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publica o site
        id: deployment
        uses: actions/deploy-pages@v4
